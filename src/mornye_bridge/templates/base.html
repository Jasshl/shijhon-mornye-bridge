<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Extension bridge{% endblock %}</title><link rel="stylesheet" href="/assets/web.css"><script src="/assets/web.js" defer></script></head>
<body><a class="skip" href="#main">Skip to content</a><header><a class="brand" href="/">Extension bridge<span>for Shijhon</span></a>
