[project]
name = "shijhon-mornye-bridge"
version = "0.1.1"
description = "Isolated Mornye extension host bridge for Shijhon"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jasshl" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.47",
    "uvicorn>=0.35",
    "httpx>=0.28",
    "pydantic>=2.11",
    "jinja2>=3.1.6",
    "argon2-cffi>=25.1.0",
    "tomlkit>=0.15.2",
]

[project.scripts]
mornye-bridge = "mornye_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "mypy>=1.17"]

[tool.hatch.build.targets.wheel]
packages = ["src/mornye_bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: opt-in native library and public extension network tests"]
addopts = "-m 'not live'"
